name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install root deps
        run: npm install --no-audit --no-fund

      - name: Build shared
        run: npm run build:shared

      - name: Install RoguelikeClient deps
        run: cd RoguelikeClient && npm install --no-audit --no-fund

      - name: TypeScript check (client)
        run: npm run typecheck:client

      - name: Build tools (compile TS)
        run: npm run build:tools

      - name: Run sim test
        run: npm run test:sim

      - name: Run UI smoke test
        run: npm run test:sim_ui

      - name: Install server deps
        run: cd server && npm install --no-audit --no-fund

      - name: Run server integration tests
        run: npm run test:server

      - name: Run online E2E test
        run: npm run test:online

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: rtd-server:${{ github.sha }},rtd-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
